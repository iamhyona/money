<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --txt:#191f28; --sub:#4e5968; --mute:#8b95a1; --faint:#b0b8c1;
  --inc:#3b82f6; --exp:#ef4444; --today:#fef9c3; --bar:#999999; --chip:#f2f4f6; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif; font-size:15px; letter-spacing:-0.01em; }
button,input,select { font:inherit; color:inherit; letter-spacing:inherit; }
button { cursor:pointer; }
.exp { color:var(--exp); } .inc { color:var(--inc); } .mute { color:var(--mute); }
.hide { display:none !important; }

/* 상단 */
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
.hd { display:flex; align-items:center; justify-content:space-between; height:44px; max-width:560px; margin:0 auto; }
.brand { border:0; background:none; padding:0; font-size:22px; font-weight:800; }
.who { border:0; background:#fff; border-radius:999px; padding:6px 12px 6px 6px; display:flex; align-items:center; gap:7px; font-weight:600; font-size:14px; }
.av { width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }
.av.ddung { background:#0047AB; } .av.hyuna { background:#FEE500; } .av.share { background:#34d399; } .av.pitch { background:#111; }
.hr { display:flex; align-items:center; gap:6px; }
.ib { width:38px; height:38px; border:0; border-radius:50%; background:#fff; display:inline-flex; align-items:center; justify-content:center; color:var(--sub); padding:0; flex:none; }
.ib svg { width:19px; height:19px; }
.ib.on { background:var(--txt); color:#fff; }
nav { display:flex; justify-content:flex-start; gap:20px; max-width:560px; margin:6px auto 0; border-bottom:1px solid var(--line); }
nav button { flex:none; border:0; background:none; padding:12px 0 10px; font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--faint); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button.on { color:var(--txt); border-bottom-color:var(--txt); }

main { max-width:560px; margin:0 auto; padding:14px 16px calc(110px + env(safe-area-inset-bottom)); }
.card { background:var(--card); border-radius:20px; padding:22px 20px; margin-bottom:12px; }
.ct { font-size:17px; font-weight:700; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
.ct small { font-size:13px; font-weight:500; color:var(--mute); }
.sec { font-size:20px; font-weight:800; margin:26px 4px 12px; }
.sec:first-child { margin-top:6px; }
.nav2 { display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
.nav2 .lbl { border:0; background:none; font-size:20px; font-weight:800; padding:4px; display:flex; align-items:center; gap:4px; }
.nav2 .lbl::after { content:''; width:7px; height:7px; border-right:2px solid var(--mute); border-bottom:2px solid var(--mute); transform:rotate(45deg); margin:-4px 0 0 6px; }
.nav2 .lbl.plain::after { display:none; }
.arw { display:flex; gap:6px; }
.arw button { width:36px; height:36px; border-radius:50%; border:0; background:#fff; font-size:18px; color:var(--sub); }

/* 숫자 요약 */
.big { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.big small { display:block; color:var(--mute); font-size:13px; margin-bottom:6px; }
.big b { font-size:24px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; }
.bal { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; justify-content:space-between; color:var(--sub); font-size:14px; }
.bal b { color:var(--txt); }
.won { font-size:.7em; font-weight:700; margin-left:1px; }

/* 도넛 + 목록 */
.donut { display:flex; justify-content:center; margin:4px 0 18px; position:relative; }
.donut .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut .c small { color:var(--mute); font-size:12px; } .donut .c b { font-size:20px; }
.leg { list-style:none; margin:0; padding:0; }
.leg li { display:flex; align-items:center; gap:10px; padding:9px 0; }
.leg .dot { width:8px; height:8px; border-radius:50%; flex:none; }
.leg .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.leg .p { color:var(--mute); font-size:13px; margin-left:6px; }
.leg .v { font-weight:600; white-space:nowrap; }
.more { width:100%; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px; color:var(--mute); margin-top:10px; font-size:14px; }
.bars li { display:block; padding:8px 0; }
.bars .row1 { display:flex; justify-content:space-between; margin-bottom:7px; }
.bars .trk { height:8px; background:var(--chip); border-radius:4px; overflow:hidden; }
.bars .fil { height:100%; background:var(--bar); border-radius:4px; }
.empty { text-align:center; color:var(--mute); padding:28px 0; font-size:14px; }
/* 눌러서 내역 보기 */
.big .tap { border:0; background:none; padding:0; text-align:left; font:inherit; color:inherit; display:block; }
.big .tap small::after, .leg li.tap .n::after { content:' ›'; color:var(--faint); }
.leg li.tap { cursor:pointer; }
.ml .tapx { padding:2px 0; }
.lh { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin:18px 4px 2px; gap:8px; min-height:34px; }
.lh .t:empty { display:none; }
.lh .sortb { margin-left:auto; }
.lh .t { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.lh .all { border:0; background:#fff; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--sub); }
.sortb { display:flex; background:#e5e8eb; border-radius:10px; padding:3px; flex:none; }
.sortb button { border:0; background:none; padding:6px 10px; font-size:13px; font-weight:600; color:var(--mute); border-radius:8px; }
.sortb button.on { background:#fff; color:var(--txt); }
.back { border:0; background:none; font-size:20px; font-weight:800; padding:4px; display:flex; align-items:center; gap:10px; }
.back::before { content:''; width:9px; height:9px; border-left:2.5px solid var(--txt); border-bottom:2.5px solid var(--txt); transform:rotate(45deg); margin-left:5px; }
.big1 small { display:block; color:var(--mute); font-size:13px; margin-bottom:6px; }
.big1 b { font-size:26px; font-weight:800; letter-spacing:-0.02em; }

/* 월별 막대 */
.mbar { display:flex; align-items:flex-end; gap:6px; height:120px; margin-top:6px; position:relative; }
.avgl { position:absolute; left:0; right:0; height:0; border-top:1.5px solid #cbd5e1; pointer-events:none; }
.avgl em { position:absolute; right:0; bottom:3px; font-size:10px; font-style:normal; font-weight:600; color:var(--mute); }
.ct .mom { font-size:13px; font-weight:600; }
.fil.cur { background:var(--exp); } .fil.avg { background:#cbd5e1; }
.cmp { margin-top:12px; font-size:14px; font-weight:600; }
.mbar div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.mbar i { display:block; width:100%; max-width:18px; background:#fecaca; border-radius:4px 4px 0 0; min-height:2px; }
.mbar div.cur i { background:var(--exp); }
.mbar span { font-size:11px; color:var(--mute); margin-top:6px; height:14px; line-height:14px; }

/* 달력 */
.cal { background:#fff; border-radius:20px; padding:14px 8px 10px; margin-bottom:12px; }
.cal .wk, .cal .grid { display:grid; grid-template-columns:repeat(7,1fr); }
.cal .wk div { text-align:center; font-size:12px; color:var(--mute); padding-bottom:8px; }
.cal .wk div:first-child { color:#f87171; }
.cal .grid button { border:0; background:none; min-height:62px; padding:4px 1px 6px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
.cal .grid button .d { font-size:14px; font-weight:600; width:26px; height:26px; line-height:26px; border-radius:50%; text-align:center; }
.cal .grid button.sun .d, .cal .grid button.hol .d { color:#f87171; }
.cal .grid button.today .d { background:var(--today); color:var(--txt); }
.cal .grid button.sel { background:var(--chip); }
.cal .grid button.out { visibility:hidden; }
.cal .grid small { font-size:10px; font-weight:600; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-0.03em; }
.mini { display:grid; grid-template-columns:1fr 1fr 1fr; background:#fff; border-radius:20px; padding:16px 8px; margin-bottom:12px; text-align:center; }
.mini small { display:block; color:var(--mute); font-size:12px; margin-bottom:4px; } .mini b { font-size:16px; }

/* 내역 */
.dayh { display:flex; justify-content:space-between; font-size:13px; color:var(--mute); padding:16px 4px 8px; }
.items { background:#fff; border-radius:20px; overflow:hidden; }
.it { display:flex; align-items:center; gap:12px; padding:14px 18px; }
.it + .it { border-top:1px solid #f2f4f6; }
.ic { width:38px; height:38px; border-radius:12px; background:var(--chip); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--sub); }
.ic svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.ic.in { color:var(--inc); }
.it .m { flex:1; min-width:0; } .it .m div { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it .m small { color:var(--mute); font-size:12px; }
.it .a { font-weight:700; white-space:nowrap; }

/* 월·연 목록 */
.ml { background:#fff; border-radius:20px; overflow:hidden; }
.ml button { width:100%; border:0; background:none; display:flex; align-items:center; padding:16px 20px; text-align:left; gap:10px; }
.ml button + button { border-top:1px solid #f2f4f6; }
.ml .k { width:62px; font-weight:700; flex:none; }
.ml .vv { flex:1; display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-weight:600; }
.ml .vv small { font-size:12px; color:var(--mute); font-weight:500; }
.ml .ch { width:7px; height:7px; border-right:2px solid var(--faint); border-top:2px solid var(--faint); transform:rotate(45deg); flex:none; margin-left:4px; }
.ml button.dim { opacity:.4; }

/* 필터 */
.fl { font-size:13px; color:var(--mute); margin:16px 2px 8px; font-weight:600; }
.fl:first-child { margin-top:0; }
.sel2 { display:flex; gap:8px; }
.sel2 select, .search { flex:1; border:0; background:var(--chip); border-radius:12px; padding:12px; font-size:15px; outline:0; width:100%; -webkit-appearance:none; appearance:none; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips button { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:14px; color:var(--sub); font-weight:500; }
.chips button.on { background:var(--txt); color:#fff; }
.res { display:flex; justify-content:space-between; align-items:baseline; margin:20px 4px 4px; }
.res b { font-size:17px; }
.reset { border:0; background:none; color:var(--mute); font-size:13px; text-decoration:underline; padding:0; }
.fgo { width:100%; border:0; background:var(--txt); color:#fff; border-radius:14px; padding:15px; font-size:16px; font-weight:700; margin-top:12px; }
.fgo:disabled { opacity:.35; }
.sum2 small { display:block; color:var(--mute); font-size:13px; margin-bottom:12px; }

/* 플로팅 버튼 */
.fab { position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:50%;
  border:0; background:var(--txt); color:#fff; box-shadow:0 8px 20px rgba(25,31,40,.25); z-index:15; display:flex; align-items:center; justify-content:center; }
.fab::before, .fab::after { content:''; position:absolute; width:22px; height:2.5px; background:#fff; border-radius:2px; }
.fab::after { transform:rotate(90deg); }

/* 바텀시트 */
.dimbg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none; transition:opacity .2s; }
.bs { position:fixed; left:0; right:0; bottom:0; z-index:31; background:#fff; border-radius:24px 24px 0 0; max-height:92vh; overflow:auto;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .22s ease, visibility .22s; max-width:560px; margin:0 auto; visibility:hidden; }
.bs { overflow-x:hidden; overscroll-behavior:contain; touch-action:pan-y; }
html { overflow-x:hidden; } body { overflow-x:clip; max-width:100%; }
html.lock { overflow:hidden; }
.bs.open { transform:none; visibility:visible; } .dimbg.open { opacity:1; pointer-events:auto; }
.bs h3 { margin:0 0 16px; font-size:20px; }
/* 시트 위쪽: 손잡이 + 닫기 (아래로 쓸어내려도 닫힘) */
.bsh { position:sticky; top:-22px; z-index:2; height:46px; margin:-22px -20px 4px; background:#fff; display:flex; justify-content:flex-end; align-items:center; padding:0 14px; touch-action:none; }
.bsh i { position:absolute; left:50%; top:9px; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:#d1d6db; }
.bsx { width:32px; height:32px; border:0; border-radius:50%; background:var(--chip); color:var(--sub); display:flex; align-items:center; justify-content:center; padding:0; margin-top:6px; }
.bsx svg { width:16px; height:16px; }
.seg { display:flex; background:var(--chip); border-radius:12px; padding:4px; margin-bottom:16px; }
.seg button { flex:1; border:0; background:none; padding:9px; border-radius:9px; font-weight:700; color:var(--mute); }
.seg button.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.seg button.on.e { color:var(--exp); } .seg button.on.i { color:var(--inc); }
.amt { display:flex; align-items:baseline; gap:4px; border-bottom:2px solid var(--line); padding:4px 2px 8px; margin-bottom:16px; }
.amt:focus-within { border-color:var(--txt); }
.amt input { border:0; outline:0; font-size:32px; font-weight:800; width:100%; background:none; letter-spacing:-0.02em; }
.amt span { font-size:22px; font-weight:700; }
.frow { display:flex; gap:8px; margin-bottom:10px; }
.f { flex:1; min-width:0; } .f label { display:block; font-size:12px; color:var(--mute); margin:0 0 5px 2px; font-weight:600; }
.f input { width:100%; border:0; background:var(--chip); border-radius:12px; padding:12px; outline:0; font-size:16px; min-height:46px; min-width:0; max-width:100%; display:block; -webkit-appearance:none; appearance:none; }
.f input[type=date], .f input[type=time] { color:var(--txt); }
/* 아이폰 날짜·시각 칸도 다른 입력칸과 같은 높이·너비·왼쪽 정렬 */
.f input { height:46px; box-sizing:border-box; }
.f input[type=date], .f input[type=time] { text-align:left; line-height:22px; }
.f input::-webkit-date-and-time-value { text-align:left; margin:0; min-height:22px; }
.f input::-webkit-datetime-edit { padding:0; }
.bs .fl { margin-top:14px; }
.acts { display:flex; gap:8px; margin-top:22px; }
.acts button { flex:1; border:0; border-radius:14px; padding:16px; font-weight:700; font-size:16px; }
.save { background:var(--txt); color:#fff; } .del { background:#fef2f2; color:var(--exp); flex:0 0 96px !important; }
.pk .yr { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.pk .yr b { font-size:20px; }
.pk .ms { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.pk .ms button { border:0; background:var(--chip); border-radius:12px; padding:14px 0; font-weight:600; }
.pk .ms button.on { background:var(--txt); color:#fff; }

/* 캡처 입력 */
.cap { width:100%; border:0; background:#FEE500; color:#191f28; border-radius:14px; padding:13px; font-weight:700; font-size:15px; margin-bottom:14px; }
/* 한 줄 입력 */
.qi { display:flex; gap:8px; align-items:stretch; margin:-4px 0 6px; }
.qi textarea { flex:1; min-width:0; border:0; background:var(--chip); border-radius:12px; padding:12px; font-size:16px; line-height:1.45; outline:0; resize:none; min-height:46px; height:46px; max-height:140px; font-family:inherit; }
.qi button { flex:none; align-self:flex-start; height:46px; border:0; background:var(--txt); color:#fff; border-radius:12px; padding:0 16px; font-weight:700; font-size:15px; }
.qih { font-size:12px; color:var(--mute); margin:0 2px 16px; line-height:1.5; }
.req { color:var(--exp); margin-left:2px; }
.rvi { display:flex; gap:10px; align-items:flex-start; padding:14px 0; border-top:1px solid #f2f4f6; }
.rvi input[type=checkbox] { width:22px; height:22px; margin:10px 0 0; accent-color:#191f28; flex:none; }
.rvi .g { flex:1; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.rvi .g input, .rvi .g select { border:0; background:var(--chip); border-radius:10px; padding:10px; font-size:16px; width:100%; outline:0; min-width:0; -webkit-appearance:none; appearance:none; min-height:42px; }
.rvi .g .w { grid-column:1 / -1; }
.rvi.off .g { opacity:.4; }
.dup { font-size:12px; color:var(--exp); }
.rvb { display:flex; align-items:center; gap:8px; border:0; background:none; padding:2px 2px 4px; font-weight:700; font-size:14px; text-align:left; }
.rvb .av { width:18px; height:18px; }
.rvb small { color:var(--mute); font-weight:500; font-size:12px; margin-left:2px; }

/* 설정 */
.tabs2 { display:flex; gap:6px; overflow-x:auto; margin:0 -4px 14px; padding:0 4px; -webkit-overflow-scrolling:touch; }
.tabs2 button { flex:none; border:0; background:var(--chip); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; color:var(--sub); }
.tabs2 button.on { background:var(--txt); color:#fff; }
.mrow { display:flex; align-items:center; gap:4px; padding:6px 0; }
.mrow + .mrow { border-top:1px solid #f2f4f6; }
.mrow input { flex:1; min-width:0; border:0; background:none; font-size:16px; padding:8px 4px; outline:0; border-radius:8px; }
.mrow input:focus { background:var(--chip); }
.mrow input.ren { color:var(--inc); }
.mrow button { flex:none; width:34px; height:34px; border:0; background:none; border-radius:50%; color:var(--mute); font-size:16px; }
.mrow button:active { background:var(--chip); }
.mrow .x { color:var(--exp); font-size:18px; }
.madd { display:flex; gap:8px; margin-top:12px; }
.madd input { flex:1; min-width:0; border:0; background:var(--chip); border-radius:12px; padding:12px; font-size:16px; outline:0; }
.madd button { border:0; background:var(--txt); color:#fff; border-radius:12px; padding:0 18px; font-weight:700; }
.msave { width:100%; border:0; background:var(--txt); color:#fff; border-radius:14px; padding:16px; font-weight:700; font-size:16px; margin-top:4px; }
.msave:disabled { background:var(--faint); }
.mnote { color:var(--mute); font-size:13px; margin:10px 4px 0; line-height:1.5; }
.ct a { color:var(--inc); font-size:13px; font-weight:600; text-decoration:none; }

/* 첫 화면 */
.full { position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
.full h1 { font-size:24px; font-weight:800; margin:0 0 8px; }
.full p { color:var(--mute); margin:0 0 28px; }
.pinIn { font-size:30px; letter-spacing:.6em; text-align:center; width:200px; border:0; border-bottom:2px solid var(--txt); background:none; outline:0; padding:6px 0 6px .6em; margin-bottom:28px; }
.btn { border:0; background:var(--txt); color:#fff; border-radius:14px; padding:15px 0; width:200px; font-weight:700; font-size:16px; }
.pick { display:flex; gap:12px; width:100%; max-width:380px; }
.pick button { flex:1; border:0; background:#fff; border-radius:24px; padding:30px 0 24px; display:flex; flex-direction:column; align-items:center; gap:14px; font-size:18px; font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.04); }
.pick .av { width:64px; height:64px; font-size:24px; }

<body>

  <div class="qi" id="qiBox"><textarea id="qiT" rows="1" placeholder="예) 10/3 3만원 올리브영 / 현대"></textarea><button type="button" id="qiB">입력</button></div>
  <div class="qih" id="qiH">(카드종류생략가능) 행갈이 시 여러 건 입력 가능</div>

  <div class="fl">기존 항목으로 바꾸기</div><div class="chips" id="dlC"></div>
  <div class="fl">새 항목으로 바꾸기</div><div class="frow"><div class="f"><input id="dlN" placeholder="새 항목 이름"></div></div>
  <div class="acts"><button class="del" id="dlKeep" style="flex:0 0 120px !important;background:var(--chip);color:var(--sub)">그대로 두기</button><button class="save" id="dlOk">바꾸고 삭제</button></div>

<script>
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
var APP_ID = 'money', BOOKS = ['hyuna', 'share', 'pitch'];   // 이 앱에서 여는 가계부
var LSP = APP_ID === 'buza' ? '' : APP_ID + ':';   // 앱마다 저장 공간 분리 (PIN 등)
var ls = { get: function (k) { try { return localStorage.getItem(LSP + k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(LSP + k, v); } catch (e) {} } };
var NAMES = { ddung: '뚠냥', hyuna: '땡깡', share: '공용', pitch: '핏치' };
// 시트 바로가기 (서버가 주소를 주면 그걸 쓰고, 없으면 아래 파일 → 폴더)
var SHEETS = { hyuna: { 2026: '1G-69lz0jbHCFD160TYduTvpZygivS5waxpktCx9O5Hc' }, ddung: { 2026: '1MIy0TJbDVJIa4Mz3XPFQXG0R33_tKmr7xLSjmeonP3Q' }, share: { 2026: '1vQ0kWRpH6ObUO9ZlOr4NEhywNcYh5ToZQ5FKRsido80' }, pitch: { 2026: '1jlpjfiuRqjMOL3YmT-CUPiXNpELxw1OVc8ydc9XzfDI' } };
var FOLDERS = { hyuna: '1EvhrYAMyCMbubEmZldQ97K2PMPJNm97_', ddung: '117BzMluYXxrP1sMmfO3XB_j70pPnnOGH', share: '1VqD--linAxOP2pLxcPO5NrM9BSLkA4tH', pitch: '1Q11v41zGbGgM3MTai6OhIpfGNTgtNzZE' };
var W = ['일', '월', '화', '수', '목', '금', '토'];
var PAL = ['#14b8a6', '#38bdf8', '#6366f1', '#a78bfa', '#f472b6', '#fb923c', '#facc15', '#84cc16'];
var OTHER = '#d1d6db';
var now = new Date();
var TODAY = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
var S = { pin: ls.get('pin') || '', key: '', view: 'dash', y: now.getFullYear(), m: now.getMonth() + 1, my: now.getFullYear(), sel: null,
  cache: {}, years: null, f: {}, edit: null, flt: fltDefault(), open: {}, ls: null };
S.sort = ['new', 'old', 'amt', 'low'].indexOf(ls.get('sort')) >= 0 ? ls.get('sort') : 'new';   // 내역 정렬: 최신순 / 고액순

// 필터 기본: 이번 달 1일 ~ 오늘
function fltDefault() {
  var d = new Date(), ym = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  return { from: ym + '-01', to: ym + '-' + ('0' + d.getDate()).slice(-2), type: '', cat: [], pay: [], kind: [], q: '', sort: 'new' };
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function cfmt(n) { n = Math.round(n); return n >= 1000000 ? Math.round(n / 10000).toLocaleString('ko-KR') + '만' : fmt(n); }
function won(n, sign) { return (sign || '') + fmt(Math.abs(n)) + '<span class="won">원</span>'; }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// 서버: 구글 Apps Script (구글 시트와 연결된 가계부 스크립트)
var API = 'https://script.google.com/macros/s/AKfycbwNkTpxm3YC9BZZMnD4mHIYPT8dmzKU3zdubMBKTuBCej0bRVvU6Egi7Z5Ra_Ct12QA/exec';
// 조회 요청은 구글 서버가 잠깐 응답을 못 하면 자동으로 다시 시도 (저장·삭제는 중복될 수 있어 다시 시도하지 않음)
var API_READ = { appHasPin: 1, appCheck: 1, appYear: 1, appYears: 1, appMaster: 1, appUsage: 1, appOcr: 1 };
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1), tries = API_READ[fn] ? 3 : 1;
  function once() {
    return fetch(API, { method: 'POST', body: JSON.stringify({ api: fn, args: args, app: APP_ID }) })
      .then(function (r) { if (!r.ok) { var e = new Error('서버에 연결하지 못했어요 (' + r.status + ')'); e.retry = true; throw e; } return r.json(); },
        function (e) { var x = new Error(/Failed to fetch|NetworkError|Load failed/.test(String(e && e.message)) ? '인터넷 연결을 확인해 주세요' : (e.message || String(e))); x.retry = true; throw x; })
      .then(function (o) {
        // 가끔 요청이 서버의 '대기 중' 응답으로 빠짐(data 없음) → 처리되지 않은 것이므로 다시 시도
        if (o && o.ok && !('data' in o)) { var e = new Error('서버에 전달되지 않았어요. 다시 시도해 주세요'); e.retry = true; throw e; }
        return o;
      });
  }
  function run(n) {
    return once().catch(function (e) {
      if (e.retry && n > 1) return new Promise(function (ok) { setTimeout(ok, 1200); }).then(function () { return run(n - 1); });
      throw e;
    });
  }
  return run(tries).then(function (o) { if (!o.ok) throw new Error(o.error || '오류가 났어요'); return o.data; });
}
// 새 버전이 올라오면 자동으로 새로 불러오기 (깃허브 페이지는 브라우저에 최대 10분 저장됨)
var APP_VER = '20261006b';
function checkUpdate() {
  fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/var APP_VER = '(\w+)'/);
    if (m && m[1] !== APP_VER && !document.querySelector('.bs.open')) location.replace(location.pathname + '?v=' + m[1]);
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(); });
checkUpdate();
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^(Exception|Error):\s*/, ''); }
function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 2200); }
function isExp(r) { return r.type !== '수입' && r.type !== '이동'; }   // 이동(계좌이동)은 지출·수입 아님
function sv(r) { return r.type === '취소' ? -r.amt : r.amt; }   // 지출 기준 값 (취소는 차감)

/* ───── 첫 화면: PIN → 사람 선택 ───── */
var pinMode = 'enter';
function showPin() {
  $('#pinScr').classList.remove('hide'); $('#whoScr').classList.add('hide'); $('#pinIn').value = '';
  call('appHasPin').then(function (has) {
    pinMode = has ? 'enter' : 'set';
    $('#pinMsg').textContent = has ? 'PIN 4자리를 입력해 주세요' : '처음이에요. 사용할 PIN 4자리를 정해 주세요';
  }).catch(function () {});
  setTimeout(function () { $('#pinIn').focus(); }, 100);
}
function showWho() { $('#pinScr').classList.add('hide'); $('#whoScr').classList.remove('hide'); }
$('#pinBtn').onclick = function () {
  var p = $('#pinIn').value.trim();
  if (!/^\d{4}$/.test(p)) return toast('숫자 4자리로 입력해 주세요');
  var b = $('#pinBtn'); b.classList.add('busy');
  (pinMode === 'set' ? call('appSetPin', p) : call('appCheck', p)).then(function () {
    S.pin = p; ls.set('pin', p); showWho();
  }).catch(function (e) { toast(errMsg(e)); }).then(function () { b.classList.remove('busy'); });
};
$('#pinIn').onkeydown = function (e) { if (e.key === 'Enter') $('#pinBtn').click(); };
$('#whoScr .pick').innerHTML = BOOKS.map(function (k) { return '<button data-k="' + k + '"><span class="av ' + k + '"></span>' + NAMES[k] + '</button>'; }).join('');
$$('#whoScr .pick button').forEach(function (b) { b.onclick = function () { pickWho(b.dataset.k); }; });
function pickWho(k) {
  if (S.key !== k) { S.cache = {}; S.years = null; S.flt.cat = []; S.flt.pay = []; S.flt.kind = []; S.mEdit = null; }
  S.key = k;
  $('#whoAv').className = 'av ' + k;  $('#whoNm').textContent = NAMES[k];
  $('#whoScr').classList.add('hide');
  go('dash');
  setTimeout(function () { if (S.key === k) getYears().catch(function () {}); }, 2500);   // YEAR 탭용 합계를 미리 받아 둠
  setTimeout(function () { if (S.key === k && !savedMaster(k)) fetchMaster(k).catch(function () {}); }, 4000);   // 설정용 카테고리도
}
$('#whoBtn').onclick = showWho;
$('#shtBtn').onclick = function () {
  if (!S.key) return;
  var y = S.view === 'month' ? S.my : S.y, d = S.cache[S.key + y] || {}, id = (SHEETS[S.key] || {})[y];
  window.open(d.url || (id ? 'https://docs.google.com/spreadsheets/d/' + id + '/edit' : 'https://drive.google.com/drive/folders/' + FOLDERS[S.key]), '_blank');
};
$('#brand').onclick = function () { S.y = now.getFullYear(); S.m = now.getMonth() + 1; go('dash'); };
$$('#nav button').forEach(function (b) { b.onclick = function () {
  if (b.dataset.v === 'cal') { S.sel = null; }
  if (b.dataset.v === 'month') S.my = S.y;
  go(b.dataset.v);
}; });
$('#fltBtn').onclick = function () { go('filter'); };
$('#setBtn').onclick = function () { go('set'); };

/* ───── 데이터 ───── */
// 빠르게 열기: 폰에 저장해 둔 지난 데이터로 먼저 그리고, 시트에서 새로 받아 바뀐 게 있으면 조용히 다시 그림
function savedYear(k) { try { return JSON.parse(ls.get('yr:' + k) || 'null'); } catch (e) { return null; } }
function clearSaved() { try { Object.keys(localStorage).forEach(function (x) { if (x.indexOf(LSP + 'yr:') === 0 || x.indexOf(LSP + 'yrs:') === 0 || x.indexOf(LSP + 'mst:') === 0) localStorage.removeItem(x); }); } catch (e) {} }
// 연도별 합계도 저장본으로 먼저 보여주고 뒤에서 새로 받음
function getYears() {
  if (S.years) return Promise.resolve(S.years);
  var k = 'yrs:' + S.key, key = S.key, saved = null;
  try { saved = JSON.parse(ls.get(k) || 'null'); } catch (e) {}
  var net = call('appYears', S.pin, S.key).then(function (l) {
    var changed = !saved || JSON.stringify(saved) !== JSON.stringify(l);
    if (S.key === key) S.years = l;
    ls.set(k, JSON.stringify(l));
    if (saved && changed && S.key === key && (S.view === 'year' || (S.view === 'list' && S.ls && S.ls.y === 'all'))) render(true);
    return l;
  });
  if (saved) { S.years = saved; net.catch(function () {}); return Promise.resolve(saved); }
  return net;
}
function getYear(y) {
  var k = S.key + y;
  if (S.cache[k]) return Promise.resolve(S.cache[k]);
  var saved = savedYear(k);
  var net = call('appYear', S.pin, S.key, y).then(function (d) {
    var changed = !saved || JSON.stringify(saved) !== JSON.stringify(d);
    S.cache[k] = d; ls.set('yr:' + k, JSON.stringify(d));
    if (saved && changed && S.key + y === k) render(true);
    return d;
  }, function (e) {
    var m = errMsg(e);
    if (/NOPIN|PIN이/.test(m)) { S.pin = ''; ls.set('pin', ''); clearSaved(); showPin(); throw e; }
    if (saved) return saved;   // 연결이 안 되면 저장본 그대로
    var d = { y: y, rows: [], months: [], hol: [], cats: [], pays: [], kinds: [], incomeCats: [], err: m };
    S.cache[k] = d; return d;
  });
  if (saved) { S.cache[k] = saved; net.catch(function () {}); return Promise.resolve(saved); }
  return net;
}
function lastMeta() {  // 입력용 목록: 가장 최근에 불러온 해
  var y = Object.keys(S.cache).filter(function (k) { return k.indexOf(S.key) === 0 && !S.cache[k].err; }).sort().pop();
  return y ? S.cache[y] : { cats: [], pays: [], kinds: [], incomeCats: [] };
}
function sumBy(rows, fn) {
  var o = {}; rows.forEach(function (r) { if (!isExp(r)) return; var k = fn(r) || '미분류'; o[k] = (o[k] || 0) + sv(r); });
  return Object.keys(o).map(function (k) { return { k: k, v: o[k] }; }).filter(function (x) { return x.v > 0; }).sort(function (a, b) { return b.v - a.v; });
}
function totals(rows) {
  var e = 0, i = 0; rows.forEach(function (r) { if (r.type === '수입') i += r.amt; else if (r.type !== '이동') e += sv(r); });
  return { e: e, i: i };
}
function kindOf(r) { return r.kind || (r.pay === '현금' ? '현금' : r.pay) || '기타'; }

/* ───── 화면 전환 ───── */
function go(v) {
  if ($$('.bs.open').length) closeBs();
  S.view = v;
  $('#fab').style.display = v === 'set' ? 'none' : '';
  $$('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
  $('#fltBtn').classList.toggle('on', v === 'filter'); $('#setBtn').classList.toggle('on', v === 'set');
  window.scrollTo(0, 0);
  render();
}
function render(quiet) {
  var v = S.view, main = $('#main');
  if (!quiet) main.innerHTML = '<div class="ld">불러오는 중…</div>';
  if (v === 'year') return renderYear();
  if (v === 'set') return renderSettings();
  if (v === 'list') return renderList();
  if (v === 'filter') return renderFilter();
  var y = v === 'month' ? S.my : S.y;
  getYear(y).then(function (d) {
    if (S.view !== v) return;
    if (v === 'dash') renderDash(d); else if (v === 'cal') renderCal(d); else if (v === 'month') renderMonth(d); else renderFilter(d);
  }).catch(function () {});
}
function navHead(label, id, plain) {

  if (rest > 0) segs.push({ k: '그 외', v: rest, c: OTHER });
  var R = 70, C = 2 * Math.PI * R, off = 0, svg = '';
  segs.forEach(function (s) {
    var len = s.v / total * C;
    svg += '<circle r="' + R + '" cx="100" cy="100" fill="none" stroke="' + s.c + '" stroke-width="34" stroke-dasharray="' + Math.max(len - 1.5, 0.1) + ' ' + C + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 100 100)"/>';
    off += len;

  }).join('');
  return '<div class="card"' + scAttr(sc) + '><div class="ct">' + title + '</div><div class="donut"><svg width="200" height="200" viewBox="0 0 200 200">' + svg + '</svg>'
    + '<div class="c"><small>' + esc(segs[0].k) + '</small><b>' + Math.round(segs[0].v / total * 100) + '%</b></div></div>'
    + '<ul class="leg">' + rows + '</ul>' + (list.length > 5 ? '<button class="more" data-more="' + id + '">' + (showAll ? '접기' : '전체 보기') + '</button>' : '') + '</div>';

function shrink(file) {
  return new Promise(function (ok, no) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1280 / img.naturalWidth), W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
      var c0 = document.createElement('canvas'); c0.width = W; c0.height = H;
      var x0 = c0.getContext('2d'); x0.drawImage(img, 0, 0, W, H); URL.revokeObjectURL(u);
      var p = x0.getImageData(0, 0, W, H).data, y, i, lum = 0, yel = [];
      var need = Math.max(24, W * 0.05);
      for (y = 0; y < H; y++) {
        var cnt = 0;
        for (var xx = 0; xx < W; xx++) {
          i = (y * W + xx) * 4; var r = p[i], g = p[i + 1], b = p[i + 2];
          lum += 0.299 * r + 0.587 * g + 0.114 * b;
          if (r > 200 && g > 170 && b < 110 && r - b > 110) cnt++;

        yel.push(cnt >= need);

      var dark = lum / (W * H) < 110;
      // 노란 구간 묶기 (작은 틈은 합치고 위아래 여유)
      var segs = [], s = -1;
      for (y = 0; y <= H; y++) {
        if (y < H && yel[y]) { if (s < 0) s = y; }
        else if (s >= 0) { if (segs.length && s - segs[segs.length - 1][1] < 12) segs[segs.length - 1][1] = y; else segs.push([s, y]); s = -1; }
      }
      segs = segs.filter(function (g) { return g[1] - g[0] >= 14; }).map(function (g) { return [Math.max(0, g[0] - 6), Math.min(H, g[1] + 6)]; });
      var rest = [], from = 0;
      segs.forEach(function (g) { if (g[0] > from) rest.push([from, g[0]]); from = g[1]; });
      if (from < H) rest.push([from, H]);
      var GAP = 16, c, x, yy;
      var sheet = function (list) {
        var total = 0; list.forEach(function (g) { total += g[1] - g[0] + GAP; });
        c = document.createElement('canvas'); c.width = W; c.height = Math.max(total, 1);
        x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, c.height); yy = 0;
      };
      var isY = function (q, j) { return q[j] > 200 && q[j + 1] > 170 && q[j + 2] < 110 && q[j] - q[j + 2] > 110; };
      var put = function (g, yellow) {
        var h = g[1] - g[0], d = x0.getImageData(0, g[0], W, h), q = d.data, x1 = W, x2 = -1, j, cx;
        // 노란 말풍선 안쪽(검은 글씨)은 뒤집지 않고, 바깥(다크모드 배경)만 뒤집음

            if (cx < W && isY(q, (ry * W + cx) * 4)) run++;

          }

        for (j = 0; j < q.length; j += 4) {

          var v = 0.299 * q[j] + 0.587 * q[j + 1] + 0.114 * q[j + 2];
          if (dark && !(cx >= x1 && cx <= x2)) v = 255 - v;
          q[j] = q[j + 1] = q[j + 2] = v;
        }

      // 두 장으로 나눠 보냄: mine = 노란 말풍선 줄, other = 나머지(상대 말풍선·이름)
      var out = { mine: '', other: '' };

      if (rest.length) { sheet(rest); rest.forEach(function (g) { put(g, false); }); out.other = c.toDataURL('image/jpeg', 0.9).split(',')[1]; }

/* ───── 한 줄 입력: "10/3 3만원 올리브영 / 현대" ───── */
// 금액: 15000 · 15,000원 · 3만원 · 1.5만 · 3만5천 · 5천원 (+를 붙이면 수입)
function qiAmt(t) {
  var m = String(t).replace(/,/g, '').match(/^(\+)?(\d+(?:\.\d+)?)(만|천)?(?:(\d+)천)?원?$/);
  if (!m) return null;
  var v = Number(m[2]) * (m[3] === '만' ? 10000 : m[3] === '천' ? 1000 : 1) + (m[4] ? Number(m[4]) * 1000 : 0);
  return v >= 10 ? { v: Math.round(v), inc: !!m[1] } : null;
}
function qiLine(s) {
  s = String(s || '').trim(); if (!s) return null;
  var date = '', y = Number(TODAY.slice(0, 4)), m;
  if ((m = s.match(/^(오늘|어제|그제)\s*/))) {
    var d = new Date(); d.setDate(d.getDate() - { 오늘: 0, 어제: 1, 그제: 2 }[m[1]]);
    date = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); s = s.slice(m[0].length);
  } else if ((m = s.match(/^(?:(\d{4})[.\/-])?(\d{1,2})\s*(?:[\/.\-]|월\s*)(\d{1,2})일?\s+/))) {
    date = (m[1] || y) + '-' + pad(Number(m[2])) + '-' + pad(Number(m[3]));
    if (!m[1] && date > TODAY) date = (y - 1) + date.slice(4);   // 앞으로의 날짜면 작년
    s = s.slice(m[0].length);
  }
  var parts = s.split('/'), main = parts[0], kindTok = parts.slice(1).join('/').trim();
  var toks = main.trim().split(/\s+/), amt = null, rest = [];
  toks.forEach(function (t) { var a = !amt && qiAmt(t); if (a) amt = a; else rest.push(t); });
  if (!amt) return { err: true, src: s };
  return { date: date, amt: amt.v, type: amt.inc ? '수입' : '지출', text: rest.join(' '), kindTok: kindTok };
}
// 예전 내역에서 같은 가게 · 카드 이름 찾아서 카테고리 · 카드 채우기
function qiGuess(it, d) {
  d = d || {};
  if (it.kindTok) {
    var q = it.kindTok.replace(/\s/g, '').toLowerCase(), ks = d.kinds || [];
    var hit = ks.filter(function (k) { var kk = k.replace(/\s/g, '').toLowerCase(); return kk === q; })[0]
      || ks.filter(function (k) { var kk = k.replace(/\s/g, '').toLowerCase(); return kk.indexOf(q) >= 0 || q.indexOf(kk.replace(/카드|체크|신용/g, '')) >= 0 && kk.replace(/카드|체크|신용/g, ''); })[0];
    it.kind = hit || it.kindTok;
  }
  var t = String(it.text).replace(/\s/g, ''), rows = (d.rows || []).slice().reverse();
  var r = t && (rows.filter(function (r) { return String(r.text || '').replace(/\s/g, '') === t; })[0]
    || rows.filter(function (r) { var x = String(r.text || '').replace(/\s/g, ''); return x.length > 1 && (x.indexOf(t) >= 0 || t.indexOf(x) >= 0); })[0]);
  if (r) { if (!it.cat && it.type !== '수입') it.cat = r.cat || ''; if (!it.kind) it.kind = r.kind || ''; }
}

function readCaps(fs) {

      .then(function (r) { items = items.concat(r.items || []); return next(); });

    RV = items.map(function (it) { return { on: true, book: BOOKS.indexOf(it.book) >= 0 ? it.book : S.key, type: it.type || '지출', text: it.text || '', amt: it.amt, time: it.time || '', cat: it.cat || '', kind: it.kind || '', date: it.date || '' }; });

    if (!(allDated && ds.length > 1)) RV.forEach(function (it) { it.date = ''; });

  }).catch(function (e) { hold(''); toast(errMsg(e)); });
}
function yearOf(k, y) {   // 아무 가계부의 연도 데이터 (캐시 공용)

  return call('appYear', S.pin, k, y).then(function (d) { S.cache[ck] = d; return d; }, function (e) {
    return { y: y, rows: [], cats: [], expCats: [], incCats: [], err: errMsg(e) };
  });
}
function loadRv(first) {

    var D = {}; books.forEach(function (k, i) { D[k] = ds[i]; });

      if (it.q) { qiGuess(it, d); it.q = false; }
      it.dup = !!d && d.rows.some(function (r) { return r.date === (it.date || date) && r.amt === Number(it.amt) && r.type !== '수입'; });

  list.forEach(function (it) {
    var dt = it.date || date; ys[Number(dt.slice(0, 4))] = 1;
    (books[it.book] = books[it.book] || []).push({ type: it.type, amt: it.amt, date: dt, time: it.time, text: String(it.text).trim(), cat: it.cat, kind: it.kind || '' });
  });
  ys = Object.keys(ys).map(Number);
  var keys = Object.keys(books), done = 0, msg = [];
  var bs = $('#rv'); bs.classList.add('busy');
  var step = function () {
    if (done >= keys.length) return Promise.resolve();
    var k = keys[done++];
    return call('appSaveMany', S.pin, k, books[k]).then(function (n) { msg.push(NAMES[k] + ' ' + n + '건'); ys.forEach(function (y) { delete S.cache[k + y]; ls.set('yr:' + k + y, ''); }); ls.set('yrs:' + k, ''); return step(); });
  };
  step().then(function () { closeBs(); toast(msg.join(', ') + ' 저장했어요'); afterChange(ys); })
    .catch(function (e) { toast(errMsg(e)); }).then(function () { bs.classList.remove('busy'); });
};

/* ───── 시트에서 바뀐 내용 자동 반영 ───── */
// 앱으로 돌아올 때 + 화면을 켜 둔 동안 1분마다 시트를 다시 읽어서, 바뀐 게 있으면 조용히 다시 그림
function softRefresh() {
  if (!S.key || !S.pin || document.hidden || S.refreshing) return;
  if ($$('.bs.open').length || !$('#whoScr').classList.contains('hide') || !$('#pinScr').classList.contains('hide')) return;
  var v = S.view;
  if (v === 'set') { if (S.mDirty) return; S.mEdit = null; return render(true); }
  if (v === 'year') { S.years = null; return render(true); }
  if (v === 'list' && S.ls && S.ls.y === 'all') { S.years = null; return; }
  var y = v === 'month' ? S.my : (v === 'filter' || (v === 'list' && S.ls && S.ls.filter)) ? Number(S.flt.to.slice(0, 4)) : v === 'list' && S.ls ? S.ls.y : S.y, k = S.key;
  S.refreshing = true;
  call('appYear', S.pin, k, y).then(function (d) {
    var old = S.cache[k + y];
    if (S.key !== k || S.view !== v) return;
    if (!old || JSON.stringify(old.rows) !== JSON.stringify(d.rows) || JSON.stringify(old.cats) !== JSON.stringify(d.cats)
      || JSON.stringify(old.expCats) !== JSON.stringify(d.expCats) || JSON.stringify(old.incCats) !== JSON.stringify(d.incCats)) {
      S.cache = {}; S.cache[k + y] = d; S.years = null; render(true);
    }
  }).catch(function () {}).then(function () { S.refreshing = false; });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) softRefresh(); });
window.addEventListener('focus', softRefresh);
setInterval(softRefresh, 60000);

/* 시작 */
if (S.pin) { showWho(); call('appCheck', S.pin).catch(function () { S.pin = ''; ls.set('pin', ''); showPin(); }); }
else showPin();
</script>
